<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProxyHub — софт</title>
<link rel="stylesheet" href="shop.css?v=1">
</head>
<body>

<!-- ПЛАШКА ПРО ОПЛАТУ. ПЕРВАЯ, ДО ВСЕГО.
     Не в подвале и не мелким шрифтом: человек, который не прочитал
     мелкий шрифт в подвале, попробует заплатить и удивится. Плашка
     нарисована только когда payment_live = false, то есть исчезает
     сама, когда оплата появится по-настоящему. -->
<div id="pay-note" class="pay-note" hidden></div>

<main class="wrap">

  <!-- ШАПКА -->
  <header class="head">
    <h1 id="shop-title">ProxyHub</h1>
    <p class="sub" id="shop-sub">Софт для прокси</p>
  </header>

  <!-- ТОВАРЫ -->
  <section id="goods" class="goods"></section>
  <!-- Если реестр не пришёл, сюда вставляется причина. Пустой блок
       без текста читался бы как «товаров нет». -->
  <p id="goods-msg" class="msg" role="status"></p>

  <!-- КАК КУПИТЬ -->
  <section class="how">
    <h2>Как купить</h2>
    <ol id="how-list"></ol>
  </section>

  <!-- ЗАЯВКА И РЕГИСТРАЦИЯ -->
  <section class="card">
    <h2 id="form-title">Заявка</h2>
    <p class="note" id="form-note"></p>

    <label for="name">Как к вам обращаться</label>
    <input id="name" type="text" autocomplete="name"
           autocapitalize="sentences" spellcheck="true" maxlength="60">

    <label for="mail">Почта для ответа</label>
    <input id="mail" type="email" autocomplete="email"
           autocapitalize="none" spellcheck="false" maxlength="120">

    <label for="which">Что нужно</label>
    <select id="which"></select>

    <label for="about">Задача своими словами, если она нестандартная</label>
    <textarea id="about" rows="3" maxlength="600"
              placeholder="например: нужен разбор чужого формата пула"></textarea>

    <label class="chk">
      <input type="checkbox" id="save">
      <span>Запомнить меня на этом устройстве</span>
    </label>

    <button type="button" id="submit">Оставить заявку</button>

    <!-- Куда девается нажатие. Сейчас сюда пишется честный ответ:
         данные не отправляются никуда. Пустой <p> выглядел бы как
         «всё отправилось». -->
    <p id="form-msg" class="msg" role="status"></p>
  </section>

  <footer class="foot">
    <p id="foot-note"></p>
  </footer>
</main>

<script src="shop-data.js?v=1"></script>
<script src="shop.js?v=1"></script>
</body>
</html>
